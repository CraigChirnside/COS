<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  a { color: var(--color-accent-700); }
  a:hover { color: var(--color-accent-900); }
  .cos-tab:hover, .cos-row:hover { background: var(--color-accent-100); }
  .cos-nudge:active { background: var(--color-accent-200); }

  /* The app owns the whole viewport. #cos-app is the scroll container the
     device frame's content area used to be, so the header scrolls away and the
     tab bar stays pinned by its own position:sticky. */
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--color-bg);
    /* Installed to a home screen there is no browser chrome, so the app would
       otherwise draw under the status bar and the home indicator. The insets
       are on body rather than the scroller so they do not scroll away, and
       body's background matches the header and tab bar so there is no seam. */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  #cos-app {
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
  }
</style>
</head>
<body>
<div id="cos-app"></div>
<script src="dom.js"></script>
<script src="app.js"></script>
<script>
  // Offline support. Registration is best-effort: it needs a secure context,
  // so over plain http on a LAN address it simply will not run and the app
  // still works, just online-only.
  if ('serviceWorker' in navigator) {
    var hadController = !!navigator.serviceWorker.controller;
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      // Only reload when an existing install was replaced — on the very first
      // registration there is nothing stale on screen to swap out.
      if (!hadController || reloading) return;
      reloading = true;
      location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
